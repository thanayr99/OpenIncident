name: OpenIncident tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run authentication and test-runner safety tests
        run: >-
          python -m pytest -q
          tests/test_password_hashing.py
          tests/test_isolated_runner.py
          tests/test_auth_ownership.py
          tests/test_test_environment_safety.py
          tests/test_incident_workflow.py
